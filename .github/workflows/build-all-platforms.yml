name: Build Request Ride

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-ride-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Flutter project
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  android:
    name: Android APK and Play Store bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: request-ride-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  web:
    name: Web application
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: request-ride-web
          path: build/web
          retention-days: 30

  windows:
    name: Windows application
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install NuGet for Windows plugins
        uses: NuGet/setup-nuget@v3
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: request-ride-windows
          path: build/windows/x64/runner/Release
          retention-days: 30

  ios:
    name: iPhone and iPad unsigned build
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned-ipa/Payload/
          cd build/ios/unsigned-ipa
          zip -qry RequestRide-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: request-ride-ios-unsigned-ipa
          path: build/ios/unsigned-ipa/RequestRide-unsigned.ipa
          retention-days: 30
