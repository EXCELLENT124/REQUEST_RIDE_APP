name: request_ride
description: Cross-platform South African ride-hailing application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 2.6.1
  flutter_map: 8.2.2
  go_router: 14.8.1
  supabase_flutter: 2.17.2
  geolocator: 13.0.2
  geolocator_android: 4.6.2
  geolocator_apple: 2.3.14
  file_picker: 8.3.7
  intl: 0.20.2
  latlong2: 0.9.1
  uuid: 4.5.1
  url_launcher: 6.3.2
  http: 1.6.0
  flutter_tts: 4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/request_ride_icon.png
    - assets/branding/request_ride_logo.png

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/branding/request_ride_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/request_ride_icon.png
    background_color: "#063F32"
    theme_color: "#063F32"
  windows:
    generate: true
    image_path: assets/branding/request_ride_icon.png
    icon_size: 256
